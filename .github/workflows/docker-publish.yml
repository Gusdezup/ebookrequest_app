name: Docker Build & Publish (fork perso → GHCR)

# - push sur main       : build + publie l'image "latest" sur GHCR
# - push d'un tag vX.Y.Z : build + publie l'image versionnee + cree une
#   Release GitHub (changelog auto-genere)
# - pull_request vers main : build de VALIDATION seulement (pas de publish),
#   sert de garde-fou pour l'auto-merge -- si le build casse, la PR reste
#   bloquee au lieu de fusionner en silence.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nom d'image en minuscules (obligatoire pour GHCR)
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        # Pas besoin de login pour un build de validation de PR (rien n'est publie)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # DS220+ = Intel Celeron (amd64) : pas besoin d'arm64, ca accelere le build.
          platforms: linux/amd64
          # Publie seulement en dehors d'une PR (validation de PR = build seul, pas de push)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
